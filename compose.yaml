services:
  db:
    image: postgres:17.6-bookworm
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: reader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-admin}
      FEEDS_PASSWORD: ${FEEDS_PASSWORD:-local-feeds}
      ARTICLES_PASSWORD: ${ARTICLES_PASSWORD:-local-articles}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "reader"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    image: rss-reader:local
    build:
      context: .
      target: runtime
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-local-admin}@db:5432/reader?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  web:
    image: rss-reader:local
    build:
      context: .
      target: runtime
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      FEEDS_DATABASE_URL: postgres://feeds_app:${FEEDS_PASSWORD:-local-feeds}@db:5432/reader?sslmode=disable
      ARTICLES_DATABASE_URL: postgres://articles_app:${ARTICLES_PASSWORD:-local-articles}@db:5432/reader?sslmode=disable
      LISTEN_ADDR: :8080
      FETCH_INTERVAL: ${FETCH_INTERVAL:-30m}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: rebuild
          path: ./cmd
        - action: rebuild
          path: ./internal
        - action: rebuild
          path: ./go.mod
        - action: rebuild
          path: ./go.sum
    healthcheck:
      test: ["CMD", "/app/reader", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres-monitor-setup:
    image: postgres:17.6-bookworm
    entrypoint: ["/bin/sh", "/setup-postgres-monitor.sh"]
    environment:
      PGHOST: db
      PGDATABASE: reader
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:-local-admin}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-local-monitor}
    volumes:
      - ./docker/setup-postgres-monitor.sh:/setup-postgres-monitor.sh:ro
    depends_on:
      db:
        condition: service_healthy

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
      - --collector.stat_statements.exclude_users=postgres,reader_monitor
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/reader?sslmode=disable
      DATA_SOURCE_USER: reader_monitor
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-local-monitor}
    depends_on:
      postgres-monitor-setup:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.5.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml

  test:
    profiles: [test]
    image: rss-reader:test
    build:
      context: .
      target: test
    environment:
      INTEGRATION_DATABASE_URL: postgres://postgres:${DB_PASSWORD:-local-admin}@db:5432/reader?sslmode=disable
      FEEDS_DATABASE_URL: postgres://feeds_app:${FEEDS_PASSWORD:-local-feeds}@db:5432/reader?sslmode=disable
      ARTICLES_DATABASE_URL: postgres://articles_app:${ARTICLES_PASSWORD:-local-articles}@db:5432/reader?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  prometheus-data:

configs:
  prometheus-config:
    file: ./docker/prometheus.yml
